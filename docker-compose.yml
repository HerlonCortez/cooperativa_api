services:
  postgres:
    image: postgres:15
    container_name: postgresSQL
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev123456
      POSTGRES_DB: db_cooperativa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_cooperativa"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: cooperativa
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_cooperativa
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: dev123456
    ports:
      - "8080:8080"

volumes:
  postgres_data: